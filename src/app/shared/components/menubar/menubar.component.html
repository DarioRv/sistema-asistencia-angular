<header class="w-full z-10 fixed">
  <nav
    class="flex justify-between gap-3 mx-auto dark:bg-transparent dark:border-none dark:text-white py-4 px-5"
  >
    <div class="logo flex gap-3 items-center">
      <div
        class="icon bg-core-primary text-white dark:bg-core-primary-400 rounded-md p-2 flex items-center justify-center"
      >
        <mat-icon>schedule</mat-icon>
      </div>
      <span class="text-2xl font-bold text-black">ASIST.IO</span>
    </div>
    <div class="flex items-center gap-3">
      <div *ngFor="let item of items">
        <a
          class="text-black text-sm font-medium hover:text-core-primary dark:hover:text-core-primary-400"
          [routerLink]="item.routerLink"
          *ngIf="!item.items"
          >{{ item.label }}</a
        >
        <ng-container *ngIf="item.items">
          <a
            class="text-black text-sm font-medium hover:text-core-primary dark:hover:text-core-primary-400 flex gap-1 items-center cursor-pointer"
            [matMenuTriggerFor]="belowMenu"
          >
            {{ item.label }}
            <mat-icon>expand_more</mat-icon>
          </a>
          <mat-menu #belowMenu="matMenu" yPosition="below">
            <a
              class="text-black text-sm font-medium hover:text-core-primary dark:hover:text-core-primary-400"
              [routerLink]="subItem.routerLink"
              mat-menu-item
              *ngFor="let subItem of item.items"
            >
              {{ subItem.label }}
            </a>
          </mat-menu>
        </ng-container>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <a
        class="text-black text-sm font-medium hover:text-core-primary"
        *ngFor="let item of authItems; let i = index"
        [routerLink]="item.routerLink"
        [ngClass]="{
          'bg-core-primary text-white dark:bg-core-primary-400 rounded-md p-3 hover:text-white hover:bg-core-primary-600':
            i === 1
        }"
      >
        {{ item.label }}
      </a>
    </div>
    <!-- <shared-theme-toggle-button class="ml-auto"></shared-theme-toggle-button> -->
  </nav>
</header>
