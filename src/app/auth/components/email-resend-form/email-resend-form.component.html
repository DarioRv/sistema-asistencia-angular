<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-form-field class="w-full mb-1">
    <mat-label>Correo</mat-label>
    <input type="text" matInput formControlName="email" required>
    @if (email.hasError('required')) {
      <mat-error>El email es requerido</mat-error>
    }
    @if (email.hasError('email')) {
      <mat-error>El formato es incorrecto</mat-error>
    }
  </mat-form-field>
  <button class="block mx-auto" mat-flat-button color="primary" type="submit" [disabled]="isSubmitting">
    {{ isSubmitting ? 'Enviando' : 'Reenviar correo'}}
    @if (isSubmitting) {
      <mat-spinner class="size-3 inline-block"></mat-spinner>
    }
  </button>
</form>
